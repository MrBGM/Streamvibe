<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - StreamVibe</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <a href="/" class="logo" style="display: block; text-align: center; margin-bottom: 2rem;">StreamVibe</a>

            <h1 class="auth-title">Connexion</h1>

            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <input type="email" class="form-control" id="email"
                           placeholder="Adresse email" required>
                </div>

                <div class="form-group">
                    <input type="password" class="form-control" id="password"
                           placeholder="Mot de passe" required>
                </div>

                <div class="form-group">
                    <label class="form-check">
                        <input type="checkbox" id="rememberMe">
                        <span>Se souvenir de moi</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-danger btn-lg" style="width: 100%;">
                    Se connecter
                </button>

                <div id="errorMessage" class="form-error" style="margin-top: 1rem; text-align: center;"></div>
            </form>

            <div class="auth-footer">
                <p>Nouveau sur StreamVibe? <a href="/register.html">Inscrivez-vous maintenant</a></p>
                <p style="margin-top: 1rem;">
                    <a href="/admin/login.html" style="color: var(--text-muted); font-size: 0.85rem;">
                        Accès Administrateur
                    </a>
                </p>
            </div>

            <!-- Info de test -->
            <div style="margin-top: 2rem; padding: 1rem; background: var(--surface-color); border-radius: var(--border-radius); font-size: 0.85rem;">
                <p style="color: var(--text-muted); margin-bottom: 0.5rem;">Compte de test:</p>
                <p style="color: var(--text-secondary); margin: 0;">
                    Email: <strong>test@streamvibe.com</strong><br>
                    Mot de passe: <strong>password123</strong>
                </p>
            </div>
        </div>
    </div>

    <script src="/js/api/config.js"></script>
    <script src="/js/api/apiService.js"></script>
    <script src="/js/utils/helpers.js"></script>
    <script src="/js/components/ui.js"></script>
    <script>
        // Vérifier si déjà connecté
        if (AuthService.isLoggedIn()) {
            window.location.href = '/profiles.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            errorDiv.textContent = '';

            try {
                const response = await AuthService.login(email, password);

                if (response.success) {
                    toast.success('Connexion réussie!');
                    // Rediriger vers la sélection de profil
                    window.location.href = '/profiles.html';
                } else {
                    errorDiv.textContent = response.message || 'Erreur de connexion';
                }
            } catch (error) {
                errorDiv.textContent = error.message || 'Email ou mot de passe incorrect';
            }
        });
    </script>
</body>
</html>
