<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - StreamVibe</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="admin-login-page">
        <div class="admin-login-card">
            <div class="admin-login-logo">
                <div class="logo">StreamVibe</div>
                <div class="subtitle">Administration</div>
            </div>

            <form id="adminLoginForm">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="email"
                           placeholder="admin@streamvibe.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" class="form-control" id="password"
                           placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-danger btn-lg" style="width: 100%;">
                    Se connecter
                </button>

                <div id="errorMessage" class="form-error" style="margin-top: 1rem; text-align: center;"></div>
            </form>

            <!-- Info de test -->
            <div style="margin-top: 2rem; padding: 1rem; background: var(--surface-light); border-radius: var(--border-radius); font-size: 0.85rem;">
                <p style="color: var(--text-muted); margin-bottom: 0.5rem;">Compte admin de test:</p>
                <p style="color: var(--text-secondary); margin: 0;">
                    Email: <strong>admin@streamvibe.com</strong><br>
                    Mot de passe: <strong>password123</strong>
                </p>
            </div>

            <div style="text-align: center; margin-top: 1.5rem;">
                <a href="/" style="color: var(--text-muted); font-size: 0.85rem;">← Retour au site</a>
            </div>
        </div>
    </div>

    <script src="/js/api/config.js"></script>
    <script src="/js/api/apiService.js"></script>
    <script src="/js/utils/helpers.js"></script>
    <script src="/js/components/ui.js"></script>
    <script>
        // Vérifier si déjà connecté
        if (AdminAuthService.isLoggedIn()) {
            window.location.href = '/admin/index.html';
        }

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            errorDiv.textContent = '';

            try {
                const response = await AdminAuthService.login(email, password);

                if (response.success) {
                    window.location.href = '/admin/index.html';
                } else {
                    errorDiv.textContent = response.message || 'Erreur de connexion';
                }
            } catch (error) {
                errorDiv.textContent = error.message || 'Email ou mot de passe incorrect';
            }
        });
    </script>
</body>
</html>
