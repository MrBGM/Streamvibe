<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - StreamVibe</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <a href="/" class="logo" style="display: block; text-align: center; margin-bottom: 2rem;">StreamVibe</a>

            <h1 class="auth-title">Créer un compte</h1>

            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <input type="text" class="form-control" id="nom_complet"
                           placeholder="Nom complet" required>
                </div>

                <div class="form-group">
                    <input type="email" class="form-control" id="email"
                           placeholder="Adresse email" required>
                </div>

                <div class="form-group">
                    <input type="tel" class="form-control" id="telephone"
                           placeholder="Téléphone (ex: +226 70 12 34 56)">
                </div>

                <div class="form-group">
                    <input type="password" class="form-control" id="password"
                           placeholder="Mot de passe (min. 6 caractères)" required minlength="6">
                </div>

                <div class="form-group">
                    <input type="password" class="form-control" id="confirmPassword"
                           placeholder="Confirmer le mot de passe" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Type d'abonnement</label>
                    <select class="form-control form-select" id="type_abonnement">
                        <option value="gratuit">Gratuit - 0 FCFA/mois</option>
                        <option value="basique">Basique - 2,500 FCFA/mois</option>
                        <option value="standard">Standard - 5,000 FCFA/mois</option>
                        <option value="premium" selected>Premium - 7,500 FCFA/mois</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-check">
                        <input type="checkbox" id="acceptTerms" required>
                        <span>J'accepte les <a href="#">conditions d'utilisation</a></span>
                    </label>
                </div>

                <button type="submit" class="btn btn-danger btn-lg" style="width: 100%;">
                    S'inscrire
                </button>

                <div id="errorMessage" class="form-error" style="margin-top: 1rem; text-align: center;"></div>
            </form>

            <div class="auth-footer">
                <p>Déjà inscrit? <a href="/login.html">Connectez-vous</a></p>
            </div>
        </div>
    </div>

    <script src="/js/api/config.js"></script>
    <script src="/js/api/apiService.js"></script>
    <script src="/js/utils/helpers.js"></script>
    <script src="/js/components/ui.js"></script>
    <script>
        // Vérifier si déjà connecté
        if (AuthService.isLoggedIn()) {
            window.location.href = '/profiles.html';
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nom_complet = document.getElementById('nom_complet').value;
            const email = document.getElementById('email').value;
            const telephone = document.getElementById('telephone').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const type_abonnement = document.getElementById('type_abonnement').value;
            const errorDiv = document.getElementById('errorMessage');

            errorDiv.textContent = '';

            // Validation
            if (password !== confirmPassword) {
                errorDiv.textContent = 'Les mots de passe ne correspondent pas';
                return;
            }

            if (password.length < 6) {
                errorDiv.textContent = 'Le mot de passe doit contenir au moins 6 caractères';
                return;
            }

            try {
                const response = await AuthService.register({
                    nom_complet,
                    email,
                    telephone,
                    mot_de_passe: password,
                    type_abonnement
                });

                if (response.success) {
                    toast.success('Compte créé avec succès!');
                    // Rediriger vers la sélection de profil
                    window.location.href = '/profiles.html';
                } else {
                    errorDiv.textContent = response.message || 'Erreur lors de l\'inscription';
                }
            } catch (error) {
                errorDiv.textContent = error.message || 'Erreur lors de l\'inscription';
            }
        });
    </script>
</body>
</html>
